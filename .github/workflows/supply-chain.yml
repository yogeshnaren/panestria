name: supply chain

on:
  schedule:
    # Nightly: new advisories can affect an unchanged lockfile.
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Vulnerability audit of the locked runtime dependencies
        run: |
          mkdir -p evidence
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > evidence/requirements-runtime.txt
          uv run --frozen --group audit pip-audit --strict --require-hashes --disable-pip -r evidence/requirements-runtime.txt
      - name: Software bill of materials
        if: always()
        run: uv export --frozen --no-dev --preview-features sbom-export --format cyclonedx1.5 > evidence/sbom-cyclonedx.json
      - name: Full history secret scan
        run: uv run --frozen python tools/secret_scan.py --history
      - name: Retain audit outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            evidence/requirements-runtime.txt
            evidence/sbom-cyclonedx.json
          if-no-files-found: warn
          retention-days: 30
