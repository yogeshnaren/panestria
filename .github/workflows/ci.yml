name: ci

on:
  push:
    branches-ignore:
      - "task/**"
  pull_request:
  schedule:
    # Nightly full regression on main: every lane, nothing deferred, deeper property tests.
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Full non-live regression or required coverage (live gates remain separate)
        type: choice
        options: [full, required]
        default: full

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      already_tested: ${{ steps.proof.outputs.already_tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The license-preservation check compares against the original commit.
          fetch-depth: 0
      - name: Reuse only proven passing PR merge content
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_merge_proof.py
      - name: Install pinned uv
        if: steps.proof.outputs.already_tested != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Node for Mission Control
        if: steps.proof.outputs.already_tested != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Typed production dashboard
        if: steps.proof.outputs.already_tested != 'true'
        working-directory: apps/mission-control
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          git diff --exit-code -- src/schema.d.ts
          npm run build
      - name: Check lock
        if: steps.proof.outputs.already_tested != 'true'
        run: uv lock --check
      - name: Install frozen dependencies
        if: steps.proof.outputs.already_tested != 'true'
        run: uv sync --frozen --group dev
      - name: Ruff
        if: steps.proof.outputs.already_tested != 'true'
        run: uv run --frozen ruff check .
      - name: Ruff format
        if: steps.proof.outputs.already_tested != 'true'
        run: uv run --frozen ruff format --check src tests tools migrations
      - name: Mypy
        if: steps.proof.outputs.already_tested != 'true'
        run: uv run --frozen mypy src/panestria
      - name: Import boundaries
        if: steps.proof.outputs.already_tested != 'true'
        run: uv run --frozen lint-imports --config .importlinter
      - name: Secret scan
        if: steps.proof.outputs.already_tested != 'true'
        run: |
          uv run --frozen python tools/secret_scan.py
          uv run --frozen python tools/secret_scan.py --history
      - name: Public surface compatibility
        if: steps.proof.outputs.already_tested != 'true'
        run: |
          uv run --frozen python tools/compat.py cli-surface --check
          uv run --frozen python tools/compat.py check --baseline evidence/regression-baseline-2026-10-28/snapshot.json
      - name: Retain source-equivalence decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-merge-proof-${{ github.sha }}
          path: evidence/ci-merge-proof.json
          if-no-files-found: error
          retention-days: 7

  behavioral:
    needs: quality
    if: needs.quality.outputs.already_tested != 'true'
    name: behavioral (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [fast, kernel, platform, research, boundary]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Install frozen dependencies
        run: uv sync --frozen --group dev
      - name: Node for physical dashboard checks
        if: matrix.suite == 'platform'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Prefer official HTTPS Ubuntu archive for browser dependencies
        if: matrix.suite == 'platform'
        run: |
          sudo python3 - <<'PYCODE'
          from pathlib import Path
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if not mirrors.is_file():
              raise SystemExit('Expected Ubuntu hosted-runner mirror list is missing')
          original = mirrors.read_text()
          slow = 'http://azure.archive.ubuntu.com/ubuntu'
          if slow in original:
              mirrors.write_text(original.replace(slow, 'https://archive.ubuntu.com/ubuntu'))
              print('Replaced the slow Azure HTTP endpoint with the official Ubuntu HTTPS archive')
          else:
              print('No Azure HTTP endpoint present; original signed package sources preserved')
          PYCODE
      - name: Build dashboard and prepare Chromium
        if: matrix.suite == 'platform'
        working-directory: apps/mission-control
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Prepare pinned worker image
        # Trusted setup runs before any actual sandbox test. Workers keep pull=never.
        if: matrix.suite != 'fast'
        run: uv run --frozen python -c 'from panestria.cli.review_demo import prepare_worker_image; prepare_worker_image()'
      - name: Tests
        env:
          CI_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'push' || github.event_name == 'schedule') && 'full' || 'required' }}
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: uv run --frozen python tools/ci_tests.py ${{ matrix.suite }} --profile "$CI_PROFILE" --base "$CI_BASE" --coverage
      - name: Retain timings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.suite }}-${{ github.sha }}
          path: |
            evidence/ci-${{ matrix.suite }}.xml
            evidence/ci-${{ matrix.suite }}-selection.json
            evidence/coverage-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 7

  # Whole-suite coverage across every lane; per-package floors only rise.
  coverage:
    needs: [quality, behavioral]
    if: needs.quality.outputs.already_tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
          python-version: "3.12"
      - name: Install frozen dependencies
        run: uv sync --frozen --group dev
      - name: Collect lane coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*-${{ github.sha }}
          path: evidence
          merge-multiple: true
      - name: Enforce coverage floors
        run: uv run --frozen python tools/coverage_floor.py evidence/coverage-fast evidence/coverage-kernel evidence/coverage-platform evidence/coverage-research evidence/coverage-boundary
      - name: Retain combined coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: evidence/coverage.json
          if-no-files-found: warn
          retention-days: 7

  # Preserve the existing required check name: partial matrix success is not green.
  test:
    if: always()
    needs: [quality, behavioral, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BEHAVIORAL_RESULT: ${{ needs.behavioral.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ALREADY_TESTED: ${{ needs.quality.outputs.already_tested }}
        run: |
          test "$QUALITY_RESULT" = success
          if test "$ALREADY_TESTED" = true; then
            test "$BEHAVIORAL_RESULT" = skipped
            test "$COVERAGE_RESULT" = skipped
          else
            test "$BEHAVIORAL_RESULT" = success
            test "$COVERAGE_RESULT" = success
          fi
