# Dev-only workspace member. It is installed into the development environment
# by the root `dev` dependency group and is never built into the panestria
# wheel or published.
[project]
name = "panestria-devkit"
version = "0.0.0"
description = "Dev-only R0 demo, synthetic journey and proposal demo for Panestria tests."
requires-python = ">=3.12"
license = "MIT"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["panestria"]

[tool.uv.sources]
panestria = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panestria_devkit"]
