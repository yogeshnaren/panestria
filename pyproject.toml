[project]
name = "panestria"
version = "0.0.0"
description = "Local synthetic-first operating system for scoped agent work."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yogesh Naren Bundey" }]
dependencies = [
  "alembic>=1.20.0",
  "cryptography==50.0.2",
  "dbos[otel]==3.2.0",
  "fastapi",
  "httpx2>=2.13.1",
  "jeepney==0.9.0 ; sys_platform == 'linux'",
  "openai>=2",
  "opentelemetry-sdk==1.45.1",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pypdf==6.20.1",
  "secretstorage==3.5.0 ; sys_platform == 'linux'",
  "sqlalchemy>=2.1.4",
  "typer>=0.12",
  "uvicorn>=0.34",
]

[project.scripts]
panestria = "panestria.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pytest",
  "ruff>=0.17.0",
]
mutation = [
  "mutmut==3.8.0",
]

[tool.uv]
required-version = "0.12.3"

[tool.pytest.ini_options]
addopts = "--strict-markers"
junit_family = "xunit1"
testpaths = ["tests"]
markers = [
  "unit: hermetic unit lane",
  "contract: toolchain and schema lane",
  "live: live lane; not part of the default synthetic run",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["panestria"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

# Bounded, offline pilot. Ordinary PR CI does not install or run this group.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
  "src/panestria/policy/engine.py",
  "src/panestria/sandbox/egress.py",
  "src/panestria/verification/entailment.py",
]
also_copy = ["tools/"]
pytest_add_cli_args = ["-p", "mutation_observer", "--maxfail=0"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_public_web_policy.py",
  "tests/unit/test_egress_addresses.py",
  "tests/unit/test_entailment_corpus.py",
  "tests/contract/test_classification_compatibility.py",
]
timeout_multiplier = 10.0
timeout_constant = 5.0
