[project]
name = "panestria"
version = "0.0.0"
description = "Local synthetic-first operating system for scoped agent work."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "third_party/*/LICENSE"]
authors = [{ name = "Yogesh Naren Bundey" }]
# Release 1 supports Linux x86-64 only (ADR 0016).
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.20.0,<2",
  "cryptography==50.0.2",
  "dbos[otel]==3.2.0",
  "fastapi>=0.143.0,<1",
  "httpx2>=2.13.1,<3",
  "idna>=3.7,<4",
  "jeepney==0.9.0 ; sys_platform == 'linux'",
  "openai>=2,<4",
  "opentelemetry-sdk==1.45.2",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pypdf==6.21.4",
  "secretstorage==3.5.0 ; sys_platform == 'linux'",
  "sqlalchemy>=2.1.4,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
panestria = "panestria.cli.main:app"

[build-system]
# Exact, so a new backend release cannot change what the wheel contains.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panestria"]

# Assets panestria.assets finds under panestria/_assets/ in an installed wheel.
# The originals stay where the repository keeps them.
[tool.hatch.build.targets.wheel.force-include]
"docs/specification/attachments/agentos-skills-v0.1.0.zip" = "panestria/_assets/agentos-skills-v0.1.0.zip"

# An sdist carries what the wheel build needs, not docs, evidence or tests.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/panestria",
  "docs/specification/attachments/agentos-skills-v0.1.0.zip",
  "LICENSE",
  "NOTICE",
  "README.md",
  "third_party",
]

[dependency-groups]
dev = [
  "httpx2",
  "hypothesis>=6.100",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "panestria-devkit",
  "pytest",
  "pytest-cov>=6",
  "pytest-timeout>=2.3",
  "ruff>=0.17.0",
]
mutation = [
  "mutmut==3.8.0",
]
# Supply-chain audit tools (CI quality and the nightly supply-chain workflow).
audit = [
  "actionlint-py==1.7.12.25",
  "pip-audit>=2.9",
  "zizmor==1.31.1",
]

[tool.uv]
required-version = "0.12.3"

# The dev-only devkit (R0 demo, synthetic journey, proposal demo) is a separate
# workspace package outside src/, so the panestria wheel never contains it.
[tool.uv.workspace]
members = ["devkit"]

[tool.uv.sources]
panestria-devkit = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-markers"
junit_family = "xunit1"
testpaths = ["tests"]
# A hung test fails instead of consuming the whole CI job budget.
timeout = 600
markers = [
  "unit: hermetic unit lane",
  "contract: toolchain and schema lane",
  "live: live lane; not part of the default synthetic run",
  "requires_nonroot: needs a non-root user; skipped locally as root, fails in CI",
  "requires_browser: needs a supported Node, @playwright/test and Chromium; skipped locally if missing, fails in CI",
  "docker_boundary: real Docker OS-boundary test; runs only in the CI boundary lane",
]

[tool.coverage.run]
branch = true
source = ["panestria"]
relative_files = true

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "devkit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["panestria", "panestria_devkit"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

# Bounded, offline pilot. Ordinary PR CI does not install or run this group.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
  "src/panestria/policy/engine.py",
  "src/panestria/sandbox/egress.py",
  "src/panestria/verification/entailment.py",
]
also_copy = ["tools/"]
pytest_add_cli_args = ["-p", "mutation_observer", "--maxfail=0"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_public_web_policy.py",
  "tests/unit/test_egress_addresses.py",
  "tests/unit/test_entailment_corpus.py",
  "tests/contract/test_classification_compatibility.py",
]
timeout_multiplier = 10.0
timeout_constant = 5.0
