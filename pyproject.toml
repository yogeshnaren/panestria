[project]
name = "panestria"
version = "0.0.0"
description = "Local synthetic-first operating system for scoped agent work."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yogesh Naren Bundey" }]
dependencies = [
  "fastapi",
  "pydantic>=2",
  "pydantic-settings>=2",
  "typer>=0.12",
]

[project.scripts]
panestria = "panestria.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pytest",
  "ruff>=0.17.0",
]

[tool.uv]
required-version = "0.12.3"

[tool.pytest.ini_options]
addopts = "--strict-markers"
junit_family = "xunit1"
testpaths = ["tests"]
markers = [
  "unit: hermetic unit lane",
  "contract: toolchain and schema lane",
  "live: live lane; not part of the default synthetic run",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["panestria"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
