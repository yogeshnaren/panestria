[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../src
sqlalchemy.url = postgresql+psycopg://invalid:invalid@127.0.0.1:1/invalid

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
