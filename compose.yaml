name: panestria-s3

services:
  postgres:
    image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: panestria_synthetic
      POSTGRES_PASSWORD: placeholder-not-a-secret
      POSTGRES_DB: panestria_synthetic
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - panestria_s3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panestria_synthetic -d panestria_synthetic"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  panestria_s3_pgdata:
    name: panestria_s3_pgdata
